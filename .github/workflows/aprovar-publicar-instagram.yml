name: Aprovar e publicar no Instagram

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Empresa a publicar
        type: choice
        required: true
        options:
          - AMD
          - MAIN
      estilo:
        description: Variante visual aprovada
        type: choice
        required: true
        options:
          - standard
          - editorial
          - institucional
          - criativo
      confirmacao:
        description: Escreve PUBLICAR para autorizar a publicação real
        type: choice
        required: true
        default: NAO
        options:
          - NAO
          - PUBLICAR

permissions:
  contents: write

concurrency:
  group: instagram-publish-${{ inputs.ticker }}-${{ inputs.estilo }}
  cancel-in-progress: false

jobs:
  publicar:
    if: inputs.confirmacao == 'PUBLICAR'
    runs-on: ubuntu-latest
    steps:
      - name: Obter pacote aprovado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Pillow
        run: python -m pip install 'Pillow>=10.0.0' requests

      - name: Validar e preparar JPEGs públicos
        env:
          TICKER: ${{ inputs.ticker }}
          ESTILO: ${{ inputs.estilo }}
        run: python preparar_publicacao_instagram.py

      - name: Guardar JPEGs para acesso público da Meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados_amd/instagram/ dados_main/instagram/
          if git diff --cached --quiet; then
            echo "JPEGs já estão atualizados."
          else
            git commit -m "Prepara imagens aprovadas para Instagram"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
          fi

      - name: Publicar conjunto aprovado
        env:
          TICKER: ${{ inputs.ticker }}
          ESTILO: ${{ inputs.estilo }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_API_BASE: ${{ vars.IG_GRAPH_API_BASE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        run: python publicar_instagram.py

  recusado:
    if: inputs.confirmacao != 'PUBLICAR'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Publicação cancelada. Para publicar, execute novamente e escolha PUBLICAR."
