name: Gerar gráficos e carrossel Instagram

on:
  push:
    branches: [main]
    paths:
      - "amd_financas.py"
      - "gerar_carrossel.py"
      - "finviz_scraper.py"
      - "gerar_carrossel_finviz.py"
      - "requirements.txt"
      - ".github/workflows/gerar-graficos.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: atualizar-graficos
  cancel-in-progress: true

jobs:
  gerar-graficos:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Gerar gráficos e carrossel
        run: python amd_financas.py
      - name: Guardar resultados no repositório
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados_amd/
          if git diff --cached --quiet; then
            echo "Não há alterações nos dados ou imagens."
            exit 0
          fi
          git commit -m "Atualiza gráficos e carrossel financeiro da AMD"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch origin main
          git rebase FETCH_HEAD
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
