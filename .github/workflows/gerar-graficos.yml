name: Gerar gráficos financeiros

on:
  push:
    branches: [main]
    paths:
      - "amd_financas.py"
      - "requirements.txt"
      - ".github/workflows/gerar-graficos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-graficos:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Executar análise e gerar PNGs
        run: python amd_financas.py
      - name: Guardar gráficos e dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados_amd/
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza gráficos e dados financeiros da AMD"
            git push
          else
            echo "Não há alterações nos dados ou gráficos."
          fi
